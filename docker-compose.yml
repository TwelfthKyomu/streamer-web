# Локальное окружение разработки.
# На проде тот же набор поднимается через Coolify на VPS.
services:
  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamer
      POSTGRES_PASSWORD: streamer
      POSTGRES_DB: streamer
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ требует монтировать именно /var/lib/postgresql:
      # данные лежат в подкаталоге с номером мажорной версии, что позволяет
      # делать pg_upgrade --link без пересечения границ точки монтирования.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streamer" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # BullMQ требует noeviction: иначе Redis может выбросить задачи очереди
    command: [ "valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: [ "centrifugo", "-c", "/centrifugo/config.json" ]
    ports:
      - "8000:8000"
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    # Centrifugo держит тысячи открытых соединений
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт бакет и открывает публичное чтение
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/streamer-media &&
      mc anonymous set download local/streamer-media
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
